# Include ONLY after creating DNS, valid TLS certificate and verified free localhost service.
# Do not replace existing site/proxy config. Example location inside chosen HTTPS server {}:
location / {
    limit_except GET POST HEAD { deny all; }
    proxy_pass http://127.0.0.1:18044;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Overwrite, never append to a user-supplied X-Forwarded-For chain.
    # Uvicorn trusts forwarded IPs ONLY from this loopback reverse proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}
