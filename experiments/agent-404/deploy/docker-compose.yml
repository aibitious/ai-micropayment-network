name: aibitious404
services:
  agent404:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agent404_experiment
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '127.0.0.1:18044:8080'
    volumes:
      - agent404_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64

volumes:
  agent404_data:
