name: Agent404 isolated tests
on:
  pull_request:
    paths:
      - 'experiments/agent-404/**'
      - '.github/workflows/agent404-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r experiments/agent-404/requirements-dev.txt
      - name: Execute tests
        working-directory: experiments/agent-404
        run: python -m pytest -q
