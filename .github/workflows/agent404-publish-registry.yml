name: Publish AIBITIOUS 404 to MCP Registry
on:
  push:
    branches:
      - feature/agent404-experiment-20261109
    paths:
      - 'experiments/agent-404/**'
      - '.github/workflows/agent404-publish-registry.yml'
permissions: {}
jobs:
  publish:
    if: github.repository == 'aibitious/ai-micropayment-network'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/agent-404/requirements-dev.txt
      - name: Test isolated 404 experiment
        working-directory: experiments/agent-404
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Install official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/publisher.tar.gz
          tar -xzf /tmp/publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate registry descriptor
        run: ./mcp-publisher validate experiments/agent-404/server.json
      - name: Authenticate with GitHub OIDC, no shared secrets
        run: ./mcp-publisher login github-oidc
      - name: Publish remote MCP endpoint
        run: ./mcp-publisher publish experiments/agent-404/server.json
